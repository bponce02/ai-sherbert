{% load django_htmx %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    {% htmx_script %}
    <style>
        /* Orange Sherbert ships no CSS framework. The only styling here is the
           structural form_layout grid — plain CSS so host builds can't purge a
           dynamically-numbered grid-cols-N. Override this template (or the
           individual page templates / the sherbert.field cotton component)
           to apply your own. */
        .sherbert-form-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: minmax(0, 1fr);
        }
        @media (min-width: 768px) {
            .sherbert-form-grid {
                grid-template-columns: repeat(var(--sherbert-form-cols, 1), minmax(0, 1fr));
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>
    {% block content %}{% endblock %}
</body>
</html>
