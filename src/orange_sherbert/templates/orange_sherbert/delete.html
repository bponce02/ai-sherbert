{% extends "orange_sherbert/base.html" %}

{% block title %}Delete {{ object }}{% endblock %}

{% block content %}
<div class="sherbert-page">
    <div class="sherbert-card">
        <h1 class="sherbert-title">Are you sure you want to delete "<strong>{{ object }}</strong>"?</h1>

        <form method="post">
            {% csrf_token %}
            <div class="sherbert-actions">
                <a href="{% url url_namespace|add:model_name|add:'-list' %}?{{ list_query_params }}" class="sherbert-btn sherbert-btn--ghost">Cancel</a>
                <button type="submit" class="sherbert-btn sherbert-btn--danger">Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
